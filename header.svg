<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <style>
    /* Style global du terminal */
    .bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5px;
      rx: 8px;
    }
    .dot {
      r: 6px;
      cy: 22px;
    }
    .dot-red { fill: #ff5f56; cx: 25px; }
    .dot-yellow { fill: #ffbd2e; cx: 45px; }
    .dot-green { fill: #27c93f; cx: 65px; }
    
    .term-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .prompt-user { fill: #3fb950; font-weight: bold; }
    .prompt-loc { fill: #58a6ff; }
    .prompt-symbol { fill: #f0f6fc; }
    
    /* Animations de révélation (Clip-paths) */
    .line1 { clip-path: url(#clip1); }
    .line2 { clip-path: url(#clip2); }
    .line3 { clip-path: url(#clip3); }
    .line5 { clip-path: url(#clip5); }
    .line7 { clip-path: url(#clip7); }
    
    .cursor {
      fill: #c9d1d9;
      animation: blink 0.8s step-end infinite;
    }

    /* Visibilité séquentielle des invites (Prompts) */
    .grp-line2 { animation: show-l2 18s infinite step-end; }
    .grp-line3 { animation: show-l3 18s infinite step-end; }
    .grp-line4 { animation: show-l4 18s infinite step-end; }
    .grp-line5 { animation: show-l5 18s infinite step-end; }
    .grp-line6 { animation: show-l6 18s infinite step-end; }
    .grp-line7 { animation: show-l7 18s infinite step-end; }

    /* Masquage global lors du clear */
    .clearable {
      animation: clear-screen 18s infinite;
    }

    @keyframes clear-screen {
      0%, 94.9% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    /* Contrôles de visibilité pas à pas */
    @keyframes show-l2 { 0%, 11.9% { opacity: 0; } 12%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes show-l3 { 0%, 25.9% { opacity: 0; } 26%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes show-l4 { 0%, 43.9% { opacity: 0; } 44%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes show-l5 { 0%, 46.9% { opacity: 0; } 47%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes show-l6 { 0%, 60.9% { opacity: 0; } 61%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }
    @keyframes show-l7 { 0%, 63.9% { opacity: 0; } 64%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }

    /* Clignotement du curseur physique */
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Écriture Ligne 1 : "Hello World ! \" (0% à 10%) */
    @keyframes type-line1 {
      0% { width: 0; }
      1% { width: 17px; }
      2.5% { width: 42px; }
      4% { width: 59px; }
      6% { width: 93px; }
      8% { width: 109px; }
      10%, 100% { width: 126px; }
    }

    /* Écriture Ligne 2 : "Don't hesitate to contact me on discord as sho7" (12% à 24%) */
    @keyframes type-line2 {
      0%, 12% { width: 0; }
      13.5% { width: 50px; }
      15% { width: 118px; }
      17% { width: 185px; }
      19.5% { width: 260px; }
      22% { width: 345px; }
      24%, 100% { width: 412px; }
    }

    /* Écriture Ligne 3 : "You can also check my root-me profile by clicking this term" (26% à 42%) */
    @keyframes type-line3 {
      0%, 26% { width: 0; }
      28.5% { width: 92px; }
      31% { width: 185px; }
      34% { width: 280px; }
      37% { width: 370px; }
      40% { width: 454px; }
      42%, 100% { width: 504px; }
    }

    /* Écriture Ligne 5 : "sudo echo $biggestProject" (47% à 59%) */
    @keyframes type-line5 {
      0%, 47% { width: 0; }
      49.5% { width: 34px; }
      52% { width: 84px; }
      55% { width: 151px; }
      59%, 100% { width: 210px; }
    }

    /* Écriture Ligne 7 : "clear" (64% à 74%) */
    @keyframes type-line7 {
      0%, 64% { width: 0; }
      66.5% { width: 17px; }
      69% { width: 25px; }
      71.5% { width: 34px; }
      74%, 100% { width: 42px; }
    }

    /* Trajet coordonné du curseur d'écriture */
    @keyframes move-cursor {
      /* Saisie Ligne 1 */
      0% { x: 151px; y: 40px; }
      1% { x: 168px; y: 40px; }
      2.5% { x: 193px; y: 40px; }
      4% { x: 210px; y: 40px; }
      6% { x: 244px; y: 40px; }
      8% { x: 260px; y: 40px; }
      10% { x: 277px; y: 40px; }
      
      /* Pause Ligne 1 */
      11.9% { x: 277px; y: 40px; }
      
      /* Saut de ligne vers Ligne 2 */
      12% { x: 42px; y: 62px; }
      
      /* Saisie Ligne 2 */
      13.5% { x: 92px; y: 62px; }
      15% { x: 160px; y: 62px; }
      17% { x: 227px; y: 62px; }
      19.5% { x: 302px; y: 62px; }
      22% { x: 387px; y: 62px; }
      24% { x: 454px; y: 62px; }
      
      /* Pause Ligne 2 */
      25.9% { x: 454px; y: 62px; }
      
      /* Saut de ligne vers Ligne 3 */
      26% { x: 42px; y: 84px; }
      
      /* Saisie Ligne 3 */
      28.5% { x: 134px; y: 84px; }
      31% { x: 227px; y: 84px; }
      34% { x: 322px; y: 84px; }
      37% { x: 412px; y: 84px; }
      40% { x: 496px; y: 84px; }
      42% { x: 546px; y: 84px; }
      
      /* Pause Ligne 3 */
      43.9% { x: 546px; y: 84px; }
      
      /* Prompt de la ligne 4 et "^C" s'affichent d'un coup sec */
      44% { x: 168px; y: 106px; }
      
      /* Pause sur la ligne 4 */
      46.9% { x: 168px; y: 106px; }
      
      /* Saut de ligne vers Ligne 5 */
      47% { x: 151px; y: 128px; }
      
      /* Saisie Ligne 5 */
      49.5% { x: 185px; y: 128px; }
      52% { x: 235px; y: 128px; }
      55% { x: 302px; y: 128px; }
      59% { x: 361px; y: 128px; }
      
      /* Pause Ligne 5 */
      60.9% { x: 361px; y: 128px; }
      
      /* Sortie de commande instantanée (Ligne 6) */
      61% { x: 277px; y: 150px; }
      
      /* Pause Ligne 6 */
      63.9% { x: 277px; y: 150px; }
      
      /* Saut de ligne vers Ligne 7 (clear) */
      64% { x: 151px; y: 172px; }
      
      /* Saisie Ligne 7 */
      66.5% { x: 168px; y: 172px; }
      69% { x: 176px; y: 172px; }
      71.5% { x: 185px; y: 172px; }
      74% { x: 193px; y: 172px; }
      
      /* Pause sur l'état final avant reset */
      94.9% { x: 193px; y: 172px; }
      
      /* Réinitialisation de la console */
      95%, 100% { x: 151px; y: 40px; }
    }

    /* Assignation des durées d'animations */
    #rect1 { animation: type-line1 18s infinite; }
    #rect2 { animation: type-line2 18s infinite; }
    #rect3 { animation: type-line3 18s infinite; }
    #rect5 { animation: type-line5 18s infinite; }
    #rect7 { animation: type-line7 18s infinite; }
    #cursor-rect { animation: move-cursor 18s infinite; }
  </style>

  <defs>
    <clipPath id="clip1"><rect id="rect1" x="151" y="40" width="0" height="20" /></clipPath>
    <clipPath id="clip2"><rect id="rect2" x="42" y="62" width="0" height="20" /></clipPath>
    <clipPath id="clip3"><rect id="rect3" x="42" y="84" width="0" height="20" /></clipPath>
    <clipPath id="clip5"><rect id="rect5" x="151" y="128" width="0" height="20" /></clipPath>
    <clipPath id="clip7"><rect id="rect7" x="151" y="172" width="0" height="20" /></clipPath>
  </defs>

  <!-- Arrière-plan de la fenêtre du terminal -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Boutons de la barre d'outils -->
  <circle class="dot dot-red" />
  <circle class="dot dot-yellow" />
  <circle class="dot dot-green" />

  <!-- Console de texte -->
  <g class="term-text" transform="translate(0, 15)">
    <!-- Ligne 1 : Toujours visible en haut -->
    <text x="25" y="55">
      <tspan class="prompt-user">noble@heart</tspan><tspan class="prompt-symbol">:</tspan><tspan class="prompt-loc">~</tspan><tspan class="prompt-symbol">$ </tspan>
    </text>
    <g class="clearable">
      <g class="line1">
        <text x="151" y="55">Hello World ! \</text>
      </g>
    </g>

    <!-- Ligne 2 -->
    <g class="clearable">
      <g class="grp-line2">
        <text x="25" y="77">&gt; </text>
        <g class="line2">
          <text x="42" y="77">Don't hesitate to contact me on discord as sho7</text>
        </g>
      </g>
    </g>

    <!-- Ligne 3 -->
    <g class="clearable">
      <g class="grp-line3">
        <text x="25" y="99">&gt; </text>
        <g class="line3">
          <text x="42" y="99">You can also check my root-me profile by clicking this term</text>
        </g>
      </g>
    </g>

    <!-- Ligne 4 (^C s'affiche de manière instantanée) -->
    <g class="clearable">
      <g class="grp-line4">
        <text x="25" y="121">
          <tspan class="prompt-user">noble@heart</tspan><tspan class="prompt-symbol">:</tspan><tspan class="prompt-loc">~</tspan><tspan class="prompt-symbol">$ </tspan>
          <tspan>^C</tspan>
        </text>
      </g>
    </g>

    <!-- Ligne 5 -->
    <g class="clearable">
      <g class="grp-line5">
        <text x="25" y="143">
          <tspan class="prompt-user">noble@heart</tspan><tspan class="prompt-symbol">:</tspan><tspan class="prompt-loc">~</tspan><tspan class="prompt-symbol">$ </tspan>
        </text>
        <g class="line5">
          <text x="151" y="143">sudo echo $biggestProject</text>
        </g>
      </g>
    </g>

    <!-- Ligne 6 (Sortie instantanée) -->
    <g class="clearable">
      <g class="grp-line6">
        <text x="25" y="165">
          <tspan class="prompt-symbol">&gt; Facial recognition </tspan>
          <tspan font-weight="bold">"Faciale"</tspan>
        </text>
      </g>
    </g>

    <!-- Ligne 7 -->
    <g class="clearable">
      <g class="grp-line7">
        <text x="25" y="187">
          <tspan class="prompt-user">noble@heart</tspan><tspan class="prompt-symbol">:</tspan><tspan class="prompt-loc">~</tspan><tspan class="prompt-symbol">$ </tspan>
        </text>
        <g class="line7">
          <text x="151" y="187">clear</text>
        </g>
      </g>
    </g>

    <!-- Curseur clignotant -->
    <rect id="cursor-rect" class="cursor" width="8" height="15" />
  </g>
</svg>
