<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250">
  <style>
    .bg {
      fill: #0d1117;
      stroke: #30363d;
      stroke-width: 1.5px;
      rx: 8px;
    }
    .dot {
      r: 6px;
      cy: 22px;
    }
    .dot-red { fill: #ff5f56; cx: 25px; }
    .dot-yellow { fill: #ffbd2e; cx: 45px; }
    .dot-green { fill: #27c93f; cx: 65px; }
    
    .term-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 14px;
      fill: #c9d1d9;
    }
    .prompt-user { fill: #3fb950; font-weight: bold; }
    .prompt-loc { fill: #58a6ff; }
    .prompt-symbol { fill: #f0f6fc; }
    
    /* Typing animations using clip-paths to reveal text character by character */
    .line1 { clip-path: url(#clip1); }
    .line2 { clip-path: url(#clip2); }
    .line3 { clip-path: url(#clip3); }
    .line4 { clip-path: url(#clip4); }
    .line5 { clip-path: url(#clip5); }
    .line6 { clip-path: url(#clip6); }
    .line7 { clip-path: url(#clip7); }
    .line8 { clip-path: url(#clip8); }
    
    .cursor {
      fill: #c9d1d9;
      animation: blink 0.8s step-end infinite;
    }

    /* Typewriter Keyframes for each line */
    @keyframes type-line1 {
      0% { width: 0; }
      9% { width: 220px; }
      100% { width: 220px; }
    }
    @keyframes type-line2 {
      0%, 11% { width: 0; }
      24% { width: 345px; }
      100% { width: 345px; }
    }
    @keyframes type-line3 {
      0%, 26% { width: 0; }
      38% { width: 310px; }
      100% { width: 310px; }
    }
    @keyframes type-line4 {
      0%, 40% { width: 0; }
      41%, 100% { width: 10px; }
    }
    @keyframes type-line5 {
      0%, 42% { width: 0; }
      52% { width: 255px; }
      100% { width: 255px; }
    }
    @keyframes type-line6 {
      0%, 54% { width: 0; }
      69% { width: 420px; }
      100% { width: 420px; }
    }
    @keyframes type-line7 {
      0%, 70% { width: 0; }
      71%, 100% { width: 10px; }
    }
    @keyframes type-line8 {
      0%, 73% { width: 0; }
      83% { width: 295px; }
      100% { width: 295px; }
    }

    /* Flashing cursor animation */
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* Seamless timeline for the cursor to follow the typing text */
    @keyframes move-cursor {
      0% { x: 25px; y: 40px; }
      9% { x: 245px; y: 40px; }
      11% { x: 25px; y: 62px; }
      24% { x: 370px; y: 62px; }
      26% { x: 25px; y: 84px; }
      38% { x: 335px; y: 84px; }
      40% { x: 35px; y: 106px; }
      42% { x: 25px; y: 128px; }
      52% { x: 280px; y: 128px; }
      54% { x: 25px; y: 150px; }
      69% { x: 445px; y: 150px; }
      70% { x: 35px; y: 172px; }
      73% { x: 25px; y: 194px; }
      83% { x: 320px; y: 194px; }
      97% { x: 320px; y: 194px; }
      100% { x: 25px; y: 40px; }
    }

    /* Assigning animation timing */
    #rect1 { animation: type-line1 14s infinite steps(26); }
    #rect2 { animation: type-line2 14s infinite steps(41); }
    #rect3 { animation: type-line3 14s infinite steps(37); }
    #rect4 { animation: type-line4 14s infinite steps(1); }
    #rect5 { animation: type-line5 14s infinite steps(30); }
    #rect6 { animation: type-line6 14s infinite steps(50); }
    #rect7 { animation: type-line7 14s infinite steps(1); }
    #rect8 { animation: type-line8 14s infinite steps(35); }
    #cursor-rect { animation: move-cursor 14s infinite; }
  </style>

  <defs>
    <clipPath id="clip1"><rect id="rect1" x="25" y="40" width="0" height="20" /></clipPath>
    <clipPath id="clip2"><rect id="rect2" x="25" y="62" width="0" height="20" /></clipPath>
    <clipPath id="clip3"><rect id="rect3" x="25" y="84" width="0" height="20" /></clipPath>
    <clipPath id="clip4"><rect id="rect4" x="25" y="106" width="0" height="20" /></clipPath>
    <clipPath id="clip5"><rect id="rect5" x="25" y="128" width="0" height="20" /></clipPath>
    <clipPath id="clip6"><rect id="rect6" x="25" y="150" width="0" height="20" /></clipPath>
    <clipPath id="clip7"><rect id="rect7" x="25" y="172" width="0" height="20" /></clipPath>
    <clipPath id="clip8"><rect id="rect8" x="25" y="194" width="0" height="20" /></clipPath>
  </defs>

  <!-- Terminal Window Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Window Header Buttons -->
  <circle class="dot dot-red" />
  <circle class="dot dot-yellow" />
  <circle class="dot dot-green" />

  <!-- Terminal Text Console -->
  <g class="term-text" transform="translate(0, 15)">
    <!-- Line 1 -->
    <g class="line1">
      <text x="25" y="55">
        <tspan class="prompt-user">noble@heart</tspan><tspan class="prompt-symbol">:</tspan><tspan class="prompt-loc">~</tspan><tspan class="prompt-symbol">$ Hi there! \</tspan>
      </text>
    </g>

    <!-- Line 2 -->
    <g class="line2">
      <text x="25" y="77">&gt; I'm Zach Heller. Welcome to my profile!</text>
    </g>

    <!-- Line 3 -->
    <g class="line3">
      <text x="25" y="99">&gt; I like making and breaking systems.</text>
    </g>

    <!-- Line 4 -->
    <g class="line4">
      <text x="25" y="121">&gt;</text>
    </g>

    <!-- Line 5 -->
    <g class="line5">
      <text x="25" y="143">&gt; Would you like to know more?</text>
    </g>

    <!-- Line 6 -->
    <g class="line6">
      <text x="25" y="165">&gt; Click this terminal to be redirected to my site.</text>
    </g>

    <!-- Line 7 -->
    <g class="line7">
      <text x="25" y="187">&gt;</text>
    </g>

    <!-- Line 8 -->
    <g class="line8">
      <text x="25" y="209">&gt; I'm going to SIGINT real quick ^C</text>
    </g>

    <!-- Flashing Typing Cursor -->
    <rect id="cursor-rect" class="cursor" width="8" height="15" />
  </g>
</svg>
